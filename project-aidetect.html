  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ENC.iterations, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  const form = document.getElementById('lock-form');
  const passwordInput = document.getElementById('lock-password');
  const errorEl = document.getElementById('lock-error');
  const gate = document.getElementById('lock-gate');
  const content = document.getElementById('protected-content');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    try {
      const salt = b64ToBytes(ENC.salt);
      const iv = b64ToBytes(ENC.iv);
      const ciphertext = b64ToBytes(ENC.ciphertext);
      const key = await deriveKey(passwordInput.value, salt);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
      const html = new TextDecoder().decode(plainBuf);
      content.innerHTML = html;
      gate.style.display = 'none';
      content.style.display = 'block';
      if (window.initRevealAndCarousels) window.initRevealAndCarousels(content);
    } catch (err) {
      errorEl.textContent = 'Incorrect password. Try again.';
    }
  });
</script>
